<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端應用程式</title>
    <style>
        /* 徹底移除所有邊距，確保 100% 滿版 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        /* 讓內嵌視窗填滿整個瀏覽器畫面 */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- ⚠️ 請將下方 src 的網址更換為您的 GAS 網頁應用程式網址 -->
